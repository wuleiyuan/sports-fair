<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 防 FOUC: 首屏立刻强制 light, 避免 body 在 React 挂载前闪黑
      // 老用户 localStorage 缓存的 'dark' 在这里也强制迁到 'light' (Apple HIG 一致性)
      (function () {
        try {
          var MIGRATION_KEY = 'theme-migrated-to-light-v1';
          if (!localStorage.getItem(MIGRATION_KEY)) {
            var saved = localStorage.getItem('theme');
            if (saved === 'dark') {
              localStorage.setItem('theme', 'light');
            }
            localStorage.setItem(MIGRATION_KEY, '1');
          }
          document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
      (function () {
        const basePath = '%BASE_URL%';
        const redirect = sessionStorage.getItem('redirect');
        if (redirect) {
          sessionStorage.removeItem('redirect');
          if (
            redirect !== basePath + '/' &&
            redirect !== basePath + '/index.html'
          ) {
            window.history.pushState(null, '', redirect);
          }
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="%BASE_URL%/images/favicon.png" />
    <!-- v2.3.0: PWA 基础 -->
    <link rel="manifest" href="%BASE_URL%/manifest.json" />
    <meta name="theme-color" content="#f5f5f7" />
    <!-- Apple Touch Icon - iOS 添加到主屏幕 -->
    <link rel="apple-touch-icon" href="%BASE_URL%/images/favicon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="运动集市" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="通用的运动数据可视化仪表盘，支持 Keep / Apple Health / Garmin / Strava 等多数据源。" />
    <title>Sports Fair · 运动集市</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
