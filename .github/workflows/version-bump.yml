# Auto bump patch version on master push + auto-create GitHub Release
# 另支持手动 backfill: Actions UI → Run workflow → 输入 tag → 仅补建该 tag 的 Release
#
# 触发 1 - push master（CI 元 commit 跳过自身）:
#   1) 读 package.json version
#   2) patch +1
#   3) 写回 package.json（npm-only 项目额外同步 package-lock.json）
#   4) 提交 chore(release): vX.Y.Z [skip ci]
#   5) push tag vX.Y.Z
#   6) 自动建 GitHub Release（不再依赖 tag→release.yml 触发链）
#
# 触发 2 - workflow_dispatch（手动 backfill）:
#   输入:
#     tag:   要补建 Release 的 tag 名（留空则用仓库当前最新 semver tag）
#     notes: 自定义 release notes（留空则从 CHANGELOG.md 抓对应段）
#   行为:
#     1) 验证 tag 存在
#     2) 抓 CHANGELOG.md 对应段（notes 优先）
#     3) 建/更新 GitHub Release（已存在则更新，不重复创建）
#     ⚠️ 不修改任何文件、不 commit、不打 tag
#
# 安全:
#   - [skip ci] 防递归
#   - permissions: contents: write 严格最小化
#   - paths 过滤: 排除纯静态数据同步（如 assets/*.svg cron 同步）
#
# 注意:
#   - pnpm 项目：npm version 只改 package.json，pnpm-lock.yaml 不动
#   - 兼容 pnpm / npm / yarn 三种 lockfile（动态检测存在与否）
#   - 2026-09-30 改造：原依赖 release.yml 在 tag push 触发，但 Actions 偶发不触发，
#     改为本 workflow 内自建 release，确保每次 push 必有 release
#   - 2026-09-30 追加：支持 workflow_dispatch 手动 backfill（修复漏建 release 的 tag）
name: Auto bump version + Release

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'public/**'
      - 'scripts/**'
      - 'api/**'
      - '.github/workflows/version-bump.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: '要补建 Release 的 tag（如 v2.5.6）。留空=用最新 semver tag'
        required: false
        default: ''
        type: string
      notes:
        description: '自定义 release notes。留空=自动从 CHANGELOG.md 抓对应段'
        required: false
        default: ''
        type: string
      dry_run:
        description: '仅打印计划（不入 release），用于调试'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # ──────── 公共步骤（两种触发都跑） ────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve target tag (workflow_dispatch only)
        id: resolve_tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          INPUT_TAG="${{ inputs.tag }}"
          if [[ -z "$INPUT_TAG" ]]; then
            # 取仓库最新 semver tag
            TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            if [[ -z "$TAG" ]]; then
              echo "::error::No semver tag found in repo. Please specify 'tag' input."
              exit 1
            fi
          else
            # 规范化: 补 v 前缀
            TAG="$INPUT_TAG"
            [[ "$TAG" != v* ]] && TAG="v$TAG"
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "::error::Tag '$TAG' does not exist in this repo."
              echo "Available tags:"
              git tag --sort=-version:refname | head -20
              exit 1
            fi
          fi
          echo "target=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved target tag: $TAG"

      # ──────── push 分支：bump + commit + tag + release ────────
      - name: Compute new patch version
        id: bump
        if: github.event_name == 'push'
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW="$MAJOR.$MINOR.$((PATCH+1))"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEW"

      - name: Bump version (npm version 同步 package.json；pnpm 项目下 lockfile 不变)
        if: github.event_name == 'push'
        run: npm version "${{ steps.bump.outputs.new }}" --no-git-tag-version --allow-same-version

      - name: Commit bumped files
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 只 add 真实变更的文件，避免 pathspec 不匹配的 fatal
          # 兼容 pnpm (pnpm-lock.yaml) / npm (package-lock.json) / yarn (yarn.lock)
          git add package.json
          for lockfile in package-lock.json pnpm-lock.yaml yarn.lock; do
            if [ -f "$lockfile" ] && ! git diff --quiet -- "$lockfile"; then
              git add "$lockfile"
            fi
          done
          # 如果没变更（极罕见: 同一 patch 重复 push）则跳过 commit
          if git diff --cached --quiet; then
            echo "No version change to commit, skipping."
            exit 0
          fi
          git commit -m "chore(release): bump version to v${{ steps.bump.outputs.new }} [skip ci]"
          git push

      - name: Push tag
        if: github.event_name == 'push'
        run: |
          git tag "v${{ steps.bump.outputs.new }}"
          git push origin "v${{ steps.bump.outputs.new }}"

      - name: Update CHANGELOG (auto-prepend placeholder section)
        if: github.event_name == 'push'
        run: |
          # 如果 CHANGELOG 还没有新版本段，自动插入占位段（避免 standards check 失败）
          # 真实段可在 commit 之后手动补充，或由后续 PR 替换占位段
          VERSION="${{ steps.bump.outputs.new }}"
          if [[ -f CHANGELOG.md ]]; then
            if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
              # 找到第一个 ## [ 段并插入
              awk -v ver="$VERSION" '
                NR==1 { print; next }
                /^## \[/ && !inserted {
                  print "## [" ver "] - '"$(date -u +%Y-%m-%d)"'"
                  print ""
                  print "### 自动维护"
                  print ""
                  print "- 由 version-bump workflow 自动生成；提交者请手动补充真实变更"
                  print ""
                  inserted=1
                }
                { print }
              ' CHANGELOG.md > CHANGELOG.md.new
              mv CHANGELOG.md.new CHANGELOG.md
              git add CHANGELOG.md
              git commit -m "docs(changelog): auto-add v${VERSION} placeholder section [skip ci]" || true
              git push
            fi
          fi

      # ──────── 共用：取 CHANGELOG 段 → 建/更新 Release ────────
      # push 路径: VERSION = bump.outputs.new
      # workflow_dispatch 路径: VERSION = resolve_tag.outputs.target
      - name: Extract CHANGELOG section
        id: changelog
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ steps.resolve_tag.outputs.target }}"
          else
            VERSION="${{ steps.bump.outputs.new }}"
          fi
          # workflow_dispatch 优先用 inputs.notes
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ -n "${{ inputs.notes }}" ]]; then
            BODY="${{ inputs.notes }}"
            echo "Using custom notes from workflow_dispatch input"
          else
            if [[ -f CHANGELOG.md ]]; then
              BODY=$(awk -v ver="$VERSION" '
                $0 ~ "^## \\[" ver "\\]" { found=1; next }
                found && $0 ~ "^## \\[" { found=0 }
                found { print }
              ' CHANGELOG.md)
            fi
            if [[ -z "${BODY:-}" ]]; then
              BODY="Release $VERSION

          See commits in https://github.com/${{ github.repository }}/compare/v${{ steps.bump.outputs.current }}...$VERSION"
            fi
          fi
          {
            printf 'body<<__EOF__\n'
            printf '%s\n' "$BODY"
            printf '__EOF__\n'
          } >> "$GITHUB_OUTPUT"

      - name: Resolve release tag name
        id: resolve_release_tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RELEASE_TAG="${{ steps.resolve_tag.outputs.target }}"
          else
            RELEASE_TAG="v${{ steps.bump.outputs.new }}"
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve_release_tag.outputs.tag }}
          BODY: ${{ steps.changelog.outputs.body }}
        run: |
          # 若 release 已存在则更新（保留 download 计数），否则新建
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Updating notes…"
            gh release edit "$RELEASE_TAG" \
              --title "Release $RELEASE_TAG" \
              --notes "$BODY"
          else
            echo "Release $RELEASE_TAG does not exist. Creating…"
            gh release create "$RELEASE_TAG" \
              --title "Release $RELEASE_TAG" \
              --notes "$BODY" \
              --target master
          fi

      - name: Dry-run report
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true'
        run: |
          RELEASE_TAG="${{ steps.resolve_release_tag.outputs.tag }}"
          BODY="${{ steps.changelog.outputs.body }}"
          echo "─── DRY RUN ───"
          echo "Would create/update release: $RELEASE_TAG"
          echo "Title: Release $RELEASE_TAG"
          echo "Notes:"
          echo "$BODY"
          echo "───────────────"

      - name: Create GitHub Release (auto push)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new }}
          name: Release v${{ steps.bump.outputs.new }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}