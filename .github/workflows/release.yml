name: Release

# 2026-06-16 v2.2.6 重写:
# 老版本两个 bug:
#   (1) push tag 触发后又跑 mathieudutour/github-tag-action 再建一个 tag,
#       结果 release 用的是 action 新建的 tag, 跟我们 push 的 vX.Y.Z 对不上;
#   (2) actions/create-release@v1 已归档 (deprecated 2024+).
#
# 新版本: push 'v*' tag → 直接用这个 tag 建 release, body 自动从 CHANGELOG.md
# 抓对应版本段落, 用 softprops/action-gh-release@v2 (active maintained).
on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG | Version: $VERSION"

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 抓 CHANGELOG.md 里 ## [X.Y.Z] 到下一个 ## [ 之间的内容
          # 没匹配上就用 fallback "Release vX.Y.Z (no changelog entry)"
          if [[ -f CHANGELOG.md ]]; then
            BODY=$(awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && $0 ~ "^## \\[" { found=0 }
              found { print }
            ' CHANGELOG.md)
          fi
          if [[ -z "${BODY:-}" ]]; then
            BODY="Release v$VERSION"
          fi
          # multiline output
          {
            echo "body<<__EOF__"
            echo "$BODY"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
