name: Run Data Sync & Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - master
    paths:
      - run_page/keep_sync.py
      - src/static/activities.json
      - requirements.txt
      - .github/workflows/run_data_sync.yml

env:
  # 2026-06-10: GitHub 将于 2026-06-16 默认切到 Node24，2026-09-16 移除 Node20 runner。
  # 当前 actions/checkout@v4 / actions/setup-python@v5 / actions/cache@v4 仍跑在 Node20，
  # 提前开启此环境变量，让 runner 把这些 JS action 强制跑在 Node24 上，避免 deprecation。
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RUN_TYPE: keep
  ATHLETE: WuLeiYuan
  TITLE: WuLeiYuan Sports
  MIN_GRID_DISTANCE: 10
  TITLE_GRID: Over 10km Runs
  IGNORE_START_END_RANGE: 10
  IGNORE_RANGE: 10
  SAVE_DATA_IN_GITHUB_CACHE: false
  DATA_CACHE_PREFIX: 'track_data'
  BUILD_GH_PAGES: false
  SAVE_TO_PARQENT: false
  GENERATE_MONTH_OF_LIFE: true
  BIRTHDAY_MONTH: 1989-03

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      SAVE_DATA_IN_GITHUB_CACHE: ${{ steps.set_output.outputs.SAVE_DATA_IN_GITHUB_CACHE }}
      DATA_CACHE_PREFIX: ${{ steps.set_output.outputs.DATA_CACHE_PREFIX }}
      BUILD_GH_PAGES: ${{ steps.set_output.outputs.BUILD_GH_PAGES }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          # hash 包含 requirements.txt + 同步脚本源码（同步脚本里 import 啥包变化也强制重装）
          cache-dependency-path: |
            requirements.txt
            run_page/keep_sync.py
            run_page/apple_health_sync.py
            run_page/apple_health_xml_sync.py
            run_page/apple_health_records_sync.py
            run_page/garmin_sync.py
            run_page/garmin_sync_cn_global.py
            run_page/strava_sync.py
            run_page/nike_sync.py
            run_page/gpx_sync.py
            run_page/fit_sync.py
            run_page/codoon_sync.py
            run_page/coros_sync.py
            run_page/joyrun_sync.py
            run_page/igpsport_sync.py
            run_page/komoot_sync.py
            run_page/generator/__init__.py
            run_page/utils.py
            run_page/config.py

      - name: Cache pip download artifacts
        # 二次保险：setup-python@v5 的 cache 已包含 wheel 下载
        # 这一步是 actions/cache 直接缓存 ~/.cache/pip，避免 runner 跨 step 重下
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt', 'run_page/keep_sync.py') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          echo "=== Installed package count ==="
          pip list | wc -l

      - name: Cache Data Files
        if: env.SAVE_DATA_IN_GITHUB_CACHE == 'true'
        uses: actions/cache@v4
        with:
          path: |
            activities
            assets
            GPX_OUT
            TCX_OUT
            FIT_OUT
            Workouts
            run_page/data.db
            src/static/activities.json
            imported.json
          key: ${{ env.DATA_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.DATA_CACHE_PREFIX }}-${{ github.sha }}-
            ${{ env.DATA_CACHE_PREFIX }}-

      - name: Run sync Keep script
        if: env.RUN_TYPE == 'keep'
        # 2026-06-16: 移除 `|| true` 静默吞错。
        # 根因: 6/09 之后 7 天 Keep 没同步, cookie 失效 / 风控 / 网络抖都被 `|| true` 吞了,
        # workflow 永远绿, 用户根本不知道 sync 挂了。
        # 现在: keep_sync.py 真崩 → step 红 → 通知用户。
        # 但因为 keep_sync.py 还会读历史 db 重写 activities.json, 局部失败可能也写出空 json,
        # 所以下面再加一道 \"sync 出来的 json 必须 ≥ 阈值\" 守门。
        run: |
          set -o pipefail
          cd /home/runner/work/sports-fair/sports-fair
          python run_page/keep_sync.py "${{ secrets.KEEP_PHONE_NUMBER }}" "${{ secrets.KEEP_PASSWORD }}" 2>&1 | tee /tmp/keep_sync.log
          # 退出码透传 (pipefail)
          echo "=== keep_sync exit OK ==="
          # 简单的 sanity: 看 log 里有没有 \"login failed\" / \"401\" / \"403\" / \"风控\" 等关键字
          if grep -E -i 'login.*fail|HTTP 401|HTTP 403|风控|invalid.*cookie|invalid.*token' /tmp/keep_sync.log; then
            echo "::error::keep_sync 登录失败 / 风控 / cookie 失效 — 请刷新 KEEP_PHONE_NUMBER / KEEP_PASSWORD secret"
            exit 1
          fi

      # 2026-06-09: 删除 "Generate activities.json from database" 步骤
      # keep_sync.py 内部已经用 generator.load() + json.dump 写 activities.json
      # 原步骤的 SQL "WHERE distance > 2000 AND type = 'Run'" 会过滤掉所有 Hiking/Walk/StairStepper 数据
      # 现在 generator.load() 已改为不过滤 type + distance > 0.1m（爬楼走 OR 例外）

      - name: Make svg GitHub profile
        if: env.RUN_TYPE != 'pass'
        env:
          TITLE: ${{ env.TITLE }}
          TITLE_GRID: ${{ env.TITLE_GRID }}
          ATHLETE: ${{ env.ATHLETE }}
          MIN_GRID_DISTANCE: ${{ env.MIN_GRID_DISTANCE }}
        run: |
          python run_page/gen_svg.py --from-db --title "$TITLE" --type github --github-style "align-firstday" --athlete "$ATHLETE" --special-distance 10 --special-distance2 20 --special-color yellow --special-color2 red --output assets/github.svg --use-localtime --min-distance 0.5
          python run_page/gen_svg.py --from-db --title "$TITLE_GRID" --type grid --athlete "$ATHLETE" --output assets/grid.svg --special-color yellow --special-color2 red --special-distance 20 --special-distance2 40 --use-localtime --min-distance "$MIN_GRID_DISTANCE"
          python run_page/gen_svg.py --from-db --type circular --use-localtime
          python run_page/gen_svg.py --from-db --year $(date +"%Y") --language zh_CN --title "$(date +"%Y") Running" --type github --github-style "align-firstday" --athlete "$ATHLETE" --special-distance 10 --special-distance2 20 --special-color yellow --special-color2 red --output assets/github_$(date +"%Y").svg --use-localtime --min-distance 0.5

      - name: Make month of life
        if: env.GENERATE_MONTH_OF_LIFE == 'true'
        env:
          BIRTHDAY_MONTH: ${{ env.BIRTHDAY_MONTH }}
        run: |
          python run_page/gen_svg.py --from-db --type monthoflife --birth "${{env.BIRTHDAY_MONTH}}" --special-color "#f9d367" --special-color2 "#f0a1a8" --output assets/mol_running.svg --use-localtime --athlete "${{env.ATHLETE}}" --title "Sports Month of Life" --sport-type running
          python run_page/gen_svg.py --from-db --type monthoflife --birth "${{env.BIRTHDAY_MONTH}}" --special-color "#f9d367" --special-color2 "#f0a1a8" --output assets/mol.svg --use-localtime --athlete "${{env.ATHLETE}}" --title "Month of Life" --sport-type all

      - name: Make year summary
        if: env.GENERATE_MONTH_OF_LIFE == 'true'
        run: |
          python run_page/gen_svg.py --from-db --type year_summary --output assets/year_summary.svg --athlete "${{ env.ATHLETE }}"

      - name: "Safety check - prevent data cliff"
        # 2026-06-13: v2.2.5 — 拦截 sync bug 删数据
        # 6/12 实战: chore: sync sports data 把 793 → 86 条, 覆盖 5 年历史
        # 保护: 对比 HEAD~ 与 working tree 的 activities.json, 下跌 > 30% (且 ≥ 50 条) 直接 fail
        # 这样 sync 不会真的把烂数据 commit/push 到 master
        #
        # 2026-06-16: v2.2.6 — 修两个空 needs 漏洞
        # (a) step-level `needs:` 在 GitHub Actions 是无效字段 (job-level 才行) →
        #     原来的 \"Push new runs\" needs: [...] 静默忽略 = safety 挂了照样 push
        # 修: safety check + push 写在同一个 step, set -e 让 safety 退非零直接终止 step,
        # 后续 push 永远不会跑到。
        # (b) keep_sync.py 静默失败时 working tree 跟 HEAD 一致, safety check 看不到 \"下跌\",
        #     但本质就是没 sync — Run sync Keep 那步现在 pipefail + grep 错误关键字守门。
        if: env.SAVE_DATA_IN_GITHUB_CACHE != 'true'
        run: |
          set -e
          cd /home/runner/work/sports-fair/sports-fair
          echo "=== Activities safety check ==="
          python3 scripts/check_activities_safety.py
          echo "=== Safety check passed ==="

      - name: Push new runs
        # 2026-06-16: v2.2.6 — 移除无效的 step-level `needs:`
        # GitHub Actions step 没有 needs 字段, 之前的 needs: [\"safety check - prevent data cliff\"]
        # 被静默忽略, safety 挂了 push 照样跑。
        # 现在依赖 step 顺序 + 上一步 set -e — safety 失败 = job 直接红 = 这步不会跑。
        if: env.SAVE_DATA_IN_GITHUB_CACHE != 'true'
        env:
          # 2026-06-10: 确保 git push 用的是 GITHUB_TOKEN 而非残留凭据
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd /home/runner/work/sports-fair/sports-fair
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin

          echo "=== Git status before add ==="
          git status
          echo "=== Git add (data files only) ==="
          git add src/static/activities.json assets/*.svg
          echo "=== Git diff --cached --stat ==="
          git diff --cached --stat || true
          if git diff --cached --quiet; then
            echo "=== No data changes, skip push ==="
            exit 0
          fi

          # ---- 仍 commit 到 master（前端构建需要 src/static/activities.json）----
          # 但 Vercel 的 vercel-build 脚本（package.json + scripts/vercel-ignore-build.sh）
          # 会先判断 src/ 是否真变了，没变就 exit 1 → Vercel 跳过构建
          # 这样"数据 commit"不消耗 Vercel 构建次数
          echo "=== Git commit ==="
          git commit -m 'chore: sync sports data'
          echo "=== Git push with force-with-lease ==="
          git push origin master --force-with-lease || {
            echo "=== force-with-lease failed, retrying with force ==="
            git push origin master --force
          }

      - name: Set Output
        id: set_output
        env:
          SAVE_DATA_IN_GITHUB_CACHE: ${{ env.SAVE_DATA_IN_GITHUB_CACHE }}
          DATA_CACHE_PREFIX: ${{ env.DATA_CACHE_PREFIX }}
          BUILD_GH_PAGES: ${{ env.BUILD_GH_PAGES }}
        run: |
          echo "SAVE_DATA_IN_GITHUB_CACHE=$SAVE_DATA_IN_GITHUB_CACHE" >> "$GITHUB_OUTPUT"
          echo "DATA_CACHE_PREFIX=$DATA_CACHE_PREFIX" >> "$GITHUB_OUTPUT"
          echo "BUILD_GH_PAGES=$BUILD_GH_PAGES" >> "$GITHUB_OUTPUT"
