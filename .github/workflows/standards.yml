name: Standards Check (C4 + OpenSSF)

# 依据：docs/standards/C4.md + docs/standards/OpenSSF-Best-Practices.md
# 用途：每次 push 与 PR 自动跑 standards-check.mjs
# 任何一条失败 → CI 红 → PR 不允许合并
#
# 满足 OpenSSF Best Practices Badge：
#   - static_analysis（MUST）
#   - static_analysis_fixed（MUST）
#   - static_analysis_often（SUGGESTED — 每次 commit 都跑）

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  standards:
    name: C4 + OpenSSF 不变量检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # version 从 package.json:6 的 packageManager 字段自动读取，无需在此指定

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Run standards check
        run: node scripts/standards-check.mjs

      - name: Annotate on failure
        if: failure()
        run: |
          echo "::error::Standards check failed — see logs above. C4 + OpenSSF invariant violations detected." \
            "Run 'node scripts/standards-check.mjs' locally and fix all ❌ items before re-pushing."
