name: Chromatic Visual Review

# 触发：PR + push 到 master
# 用途：用 Playwright 生成全页截图，Chromatic 做 1:1 pixel diff + UI review 流
# 优雅降级：缺少 CHROMATIC_PROJECT_TOKEN 时不 fail，workflow 末尾发 warning comment
on:
  pull_request:
  push:
    branches: [master]

env:
  # 2026-06-10: GitHub 将于 2026-06-16 默认切到 Node24，2026-09-16 移除 Node20 runner。
  # 提前开启此环境变量，让 runner 把 JS action 强制跑在 Node24 上，避免 deprecation。
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  chromatic:
    name: Visual regression via Chromatic
    runs-on: ubuntu-latest
    permissions:
      # Chromatic 会向 PR/branch 写 status check + comment
      contents: read
      pull-requests: write
      checks: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Chromatic 需要完整 git 历史做 baseline 比对
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version 从 package.json:6 的 packageManager 字段自动读取

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        # unset NODE_ENV：防止上游 runner 把 NODE_ENV=production 传进来，
        # 导致 pnpm 跳过 devDependencies 安装（chromatic / @playwright/test 都在 devDeps）
        run: unset NODE_ENV && pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Refresh Playwright visual baselines
        # 用最新构建产物刷新本地 baseline；Chromatic 拿到的是「新图」，
        # 跟云端历史 baseline 比，UI 改动会被识别为 change
        run: pnpm run visual:update

      # —— 优雅降级开始 ——
      # 如果仓库还没在 Chromatic 上激活（secrets.CHROMATIC_PROJECT_TOKEN 未设置），
      # 用 continue-on-error 让这一行 fail 时不中断整个 job，最后再发一条 warning。
      - name: Upload screenshots to Chromatic
        id: chromatic
        # 当 token 缺失（chromatic CLI 报错）时不 fail pipeline
        continue-on-error: true
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "::warning::CHROMATIC_PROJECT_TOKEN secret is not set. Skipping Chromatic upload."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm exec chromatic \
            --project-token="$CHROMATIC_PROJECT_TOKEN" \
            --exit-zero-on-changes
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Notify missing Chromatic token (PR comment)
        if: steps.chromatic.outputs.skipped == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### ⚠️ Chromatic Visual Review — skipped',
              '',
              '`secrets.CHROMATIC_PROJECT_TOKEN` is **not configured** for this repository,',
              'so screenshots were not uploaded to Chromatic for UI review.',
              '',
              '**How to enable:**',
              '1. Sign up / log in at <https://www.chromatic.com/>',
              '2. Create a project for `sports-fair` and copy the project token',
              '3. Add it as a repository secret named `CHROMATIC_PROJECT_TOKEN`',
              '   (`Settings` → `Secrets and variables` → `Actions` → `New repository secret`)',
              '4. Re-run this workflow',
              '',
              'Until then, Playwright visual baselines were refreshed locally and pushed by this PR,',
              'but no cloud-side review is happening. See `docs/CHROMATIC.md` for details.',
              '',
              '_Auto-generated by `.github/workflows/chromatic.yml`_'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
